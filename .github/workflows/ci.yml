name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-typecheck-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Run ruff check
        run: ruff check audiobookdl tests scripts

      - name: Run mypy
        run: mypy audiobookdl

      - name: Run unit and integration tests (Linux headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -m "not e2e" -q
        continue-on-error: false

      - name: Run unit and integration tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -m "not e2e" -q

      - name: Run end-to-end tests (Linux headless)
        if: runner.os == 'Linux'
        env:
          AUDIOBOOK_DL_E2E_REQUIRE_FFMPEG: "1"
          AUDIOBOOK_DL_E2E_REQUIRE_GUI: "1"
          AUDIOBOOK_DL_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: xvfb-run -a python -m pytest -m e2e -v
        continue-on-error: false

      - name: Run end-to-end tests (Windows)
        if: runner.os == 'Windows'
        env:
          AUDIOBOOK_DL_E2E_REQUIRE_FFMPEG: "1"
          AUDIOBOOK_DL_E2E_REQUIRE_GUI: "1"
          AUDIOBOOK_DL_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: python -m pytest -m e2e -v

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ runner.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
