name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run test suite
        run: python -m pytest -m "not e2e" -q

      - name: Build and verify portable executables
        run: |
          python scripts/build_exe.py --onefile --verify
          python scripts/build_exe.py --onedir --verify
          Compress-Archive -Path dist/audiobook-dl -DestinationPath dist/audiobook-dl-portable-win64.zip -Force

      - name: Upload Windows binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/audiobook-dl.exe
            dist/audiobook-dl-portable-win64.zip

  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package distributions
        run: twine check dist/*

      - name: Smoke test wheel installation in clean virtualenv
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import audiobookdl, audiobookdl.gui; print(audiobookdl.__version__)"

      - name: Upload Python package distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  release-github:
    needs: [build-windows, build-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/audiobook-dl.exe
            dist/audiobook-dl-portable-win64.zip
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    needs: [build-windows, build-dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/audiobook-dl
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
