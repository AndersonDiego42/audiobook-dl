name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Build and verify portable executables
        run: |
          python scripts/build_exe.py --onefile --verify
          python scripts/build_exe.py --onedir --verify
          Compress-Archive -Path dist/audiobook-dl -DestinationPath dist/audiobook-dl-portable-win64.zip -Force

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/audiobook-dl.exe
            dist/audiobook-dl-portable-win64.zip
