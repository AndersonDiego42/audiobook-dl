[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-dl"
authors = [
    { name = "Joakim Holm", email = "mail@joakimholm.xyz" }
]
description = "CLI tool for downloading audiobooks from online sources"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["audiobooks", "cli", "downloader"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "attrs",
    "cssselect",
    "keyring; sys_platform != 'win32'",
    "lxml",
    "m3u8",
    "mutagen",
    "pillow",
    "platformdirs>=4",
    "pycountry",
    "pycryptodome",
    "python-dateutil",
    "requests",
    "rich",
    "tomli; python_version < '3.11'",
    "urllib3>=2",
]
dynamic = ["version"]

[project.optional-dependencies]
export = ["openpyxl>=3.1"]
impersonate = ["curl_cffi>=0.7"]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-requests",
    "types-python-dateutil",
]
build = [
    "pyinstaller>=6",
]

[project.urls]
"Homepage" = "https://github.com/jo1gi/audiobook-dl"
"Bugtracker" = "https://github.com/jo1gi/audiobook-dl/issues"

[project.scripts]
audiobook-dl = "audiobookdl.__main__:main"

[project.gui-scripts]
audiobook-dl-gui = "audiobookdl.gui:main"

[tool.setuptools.dynamic]
version = {attr = "audiobookdl.__version__"}

[tool.setuptools.packages.find]
include = ["audiobookdl*"]

[tool.setuptools.package-data]
audiobookdl = ["assets/*.txt", "assets/*.ico", "assets/errors/*.txt", "assets/sources/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "E722", "F", "B", "UP"]

[tool.mypy]
ignore_missing_imports = true
allow_untyped_globals = false
disallow_untyped_calls = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests exercising real CLI/GUI processes, HTTP servers, and media pipelines",
    "gui: Tests requiring a Tkinter display",
    "ffmpeg: Tests requiring ffmpeg and ffprobe executables",
    "real_integrity: Tests exercising real ffprobe media integrity verification without stubbing",
    "no_probe_stub: Unit tests that opt out of dummy ffprobe stubbing while mocking probe calls directly",
]
