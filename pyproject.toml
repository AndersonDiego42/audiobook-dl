[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-dl"
authors = [
    { name = "Joakim Holm", email = "mail@joakimholm.xyz" }
]
description = "Desktop GUI application for downloading audiobooks from online sources"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["audiobooks", "gui", "desktop", "downloader"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "attrs",
    "cssselect",
    "keyring; sys_platform != 'win32'",
    "lxml",
    "m3u8",
    "mutagen",
    "pillow",
    "platformdirs>=4",
    "pycountry",
    "pycryptodome",
    "python-dateutil",
    "requests",
    "tomli; python_version < '3.11'",
    "tomlkit>=0.12",
    "urllib3>=2",
    "yt-dlp>=2024.12.0",
]
dynamic = ["version"]

[project.optional-dependencies]
export = ["openpyxl>=3.1"]
impersonate = ["curl_cffi>=0.7"]
dnd = ["tkinterdnd2>=0.4"]
tray = ["pystray>=0.19"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-requests",
    "types-python-dateutil",
]
build = [
    "pyinstaller>=6",
]

[project.urls]
"Homepage" = "https://github.com/jo1gi/audiobook-dl"
"Bugtracker" = "https://github.com/jo1gi/audiobook-dl/issues"

[project.gui-scripts]
audiobook-dl = "audiobookdl.gui:main"
audiobook-dl-gui = "audiobookdl.gui:main"

[tool.setuptools.dynamic]
version = {attr = "audiobookdl.__version__"}

[tool.setuptools.packages.find]
include = ["audiobookdl*"]

[tool.setuptools.package-data]
audiobookdl = ["assets/*.txt", "assets/*.ico", "assets/errors/*.txt", "assets/sources/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "E722", "F", "B", "UP", "C4", "SIM", "PERF", "PT", "RUF100"]
ignore = [
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM110",
    "SIM112",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM300",
    "SIM401",
    "PERF203",
    "PERF401",
    "PERF402",
    "PERF403",
    "PT011",
    "PT018",
]

[tool.ruff.lint.per-file-ignores]
"audiobookdl/**/*.py" = ["PT"]
"scripts/**/*.py" = ["PT"]

[tool.mypy]
ignore_missing_imports = true
allow_untyped_globals = false
disallow_untyped_calls = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["mutagen.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests exercising real GUI subprocesses, HTTP servers, and media pipelines",
    "gui: Tests requiring a Tkinter display",
    "ffmpeg: Tests requiring ffmpeg and ffprobe executables",
    "real_integrity: Tests exercising real ffprobe media integrity verification without stubbing",
    "no_probe_stub: Unit tests that opt out of dummy ffprobe stubbing while mocking probe calls directly",
    "no_worker_cap: Unit tests verifying production ThreadPoolExecutor sizing or thread behavior",
]
